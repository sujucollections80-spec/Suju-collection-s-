<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suju Collections - Admin</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#fff5f8;color:#222}
header{background:#111;color:white;padding:18px;text-align:center}
main{max-width:700px;margin:auto;padding:20px}
.box{background:white;padding:20px;border-radius:14px;margin-bottom:20px;box-shadow:0 2px 10px #ddd}
input,textarea,select{width:100%;padding:12px;margin:7px 0 12px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px}
button{padding:12px 18px;border:0;border-radius:8px;background:#e91e63;color:white;font-weight:bold;margin:4px}
button.delete{background:#d32f2f}
button.edit{background:#555}
[hidden]{display:none!important}
.product{padding:12px;border-bottom:1px solid #ddd}
.product img{width:80px;height:80px;object-fit:cover;border-radius:8px}
a{color:#e91e63}
</style>
</head>

<body>

<header>
<h2>🛍️ Suju Collections</h2>
<div>Admin Panel</div>
</header>

<main>

<section id="loginBox" class="box">
<h2>🔐 Admin Login</h2>
<p>Password enter చేయండి</p>

<input id="adminPassword" type="password" placeholder="Admin Password">

<button onclick="loginAdmin()">Login</button>

<p>Default password: <b>suju1234</b></p>
</section>

<section id="adminPanel" class="box" hidden>

<h2>➕ Add / Edit Product</h2>

<input id="editId" type="hidden">

<label>Product Name</label>
<input id="pName" placeholder="Product name">

<label>Price ₹</label>
<input id="pPrice" type="number" placeholder="Price">

<label>Stock</label>
<input id="pStock" type="number" placeholder="Stock quantity">

<label>Category</label>
<input id="pCategory" placeholder="Category">

<label>Description</label>
<textarea id="pDesc" placeholder="Product description"></textarea>

<label>Product Photo</label>
<input id="pImage" type="file" accept="image/*">

<br>

<button onclick="saveProduct()">💾 Save Product</button>
<button onclick="clearForm()">Clear</button>
<button onclick="logoutAdmin()">Logout</button>

<hr>

<h2>📦 Products</h2>
<div id="adminProducts"></div>

</section>

</main>

<script src="admin.js"></script>

</body>
</html>
